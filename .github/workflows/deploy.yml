name: Deploy LINE Protection Bot

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flask requests

      - name: Check files
        run: |
          echo "Current directory:"
          pwd
          echo "Files:"
          ls -la
          echo "Searching for app.py:"
          find . -maxdepth 3 -name "app.py" -print

      - name: Check app.py
        run: |
          python -m py_compile ./app.py
          echo "app.py syntax OK!"

      - name: Check LINE secrets
        env:
          LINE_CHANNEL_SECRET: ${{ secrets.LINE_CHANNEL_SECRET }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
        run: |
          test -n "$LINE_CHANNEL_SECRET"
          test -n "$LINE_CHANNEL_ACCESS_TOKEN"
          echo "LINE secrets are configured."

      - name: Run LINE Bot
        env:
          LINE_CHANNEL_SECRET: ${{ secrets.LINE_CHANNEL_SECRET }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
        run: |
          python app.py

      - name: Post Set up Python
        if: always()
        run: echo "Workflow finished."
