name: Deploy LINE Protection Bot

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          if [ -f "$GITHUB_WORKSPACE/requirements.txt" ]; then
            pip install -r "$GITHUB_WORKSPACE/requirements.txt"
          else
            pip install flask requests
          fi

          - name: Check app.py
          run: |
          echo "Current directory:"
          pwd
          echo "Files:"
          ls -la
          echo "Searching for app.py..."
          find . -maxdepth 3 -name "app.py" -print
          if [ -f "./app.py" ]; then
            echo "app.py found!"
            python -m py_compile ./app.py
            echo "app.py syntax OK!"
          else
            echo "ERROR: app.py not found!"
            exit 1
          fi
          
        

      - name: Check LINE secrets
        env:
          LINE_CHANNEL_SECRET: ${{ secrets.LINE_CHANNEL_SECRET }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
        run: |
          test -n "$LINE_CHANNEL_SECRET"
          test -n "$LINE_CHANNEL_ACCESS_TOKEN"
          echo "LINE secrets are configured!"

      - name: Run LINE Bot
        env:
          LINE_CHANNEL_SECRET: ${{ secrets.LINE_CHANNEL_SECRET }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
        run: |
          python3 "$GITHUB_WORKSPACE/app.py"
