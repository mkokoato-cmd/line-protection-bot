name: Deploy LINE Protection Bot

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install flask requests

      - name: Show files
        run: |
          echo "Current directory:"
          pwd
          echo "Files:"
          ls -la
          echo "Git files:"
          git ls-files

      - name: Find app.py
        run: |
          APP_FILE=$(git ls-files | grep -E '(^|/)app\.py$' | head -n 1)

          if [ -z "$APP_FILE" ]; then
            echo "ERROR: app.py is not tracked by Git!"
            exit 1
          fi

          echo "Found: $APP_FILE"
          echo "APP_FILE=$APP_FILE" >> "$GITHUB_ENV"

      - name: Check app.py
        run: |
          python -m py_compile "$APP_FILE"
          echo "app.py syntax OK!"

      - name: Check LINE secrets
        env:
          LINE_CHANNEL_SECRET: ${{ secrets.LINE_CHANNEL_SECRET }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
        run: |
          test -n "$LINE_CHANNEL_SECRET"
          test -n "$LINE_CHANNEL_ACCESS_TOKEN"
          echo "LINE secrets are configured!"

      - name: Run LINE Bot
        env:
          LINE_CHANNEL_SECRET: ${{ secrets.LINE_CHANNEL_SECRET }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
        run: |
          python "$APP_FILE"
