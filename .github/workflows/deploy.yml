name: Deploy LINE Protection Bot

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install flask requests
          fi

      - name: Check files
        run: |
          echo "Current directory:"
          pwd
          echo "Files:"
          ls -la
          echo "Checking app.py:"
          test -f app.py
          echo "app.py found!"

      - name: Check LINE secrets
        env:
          LINE_CHANNEL_SECRET: ${{ secrets.LINE_CHANNEL_SECRET }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
        run: |
          test -n "$LINE_CHANNEL_SECRET"
          test -n "$LINE_CHANNEL_ACCESS_TOKEN"
          echo "LINE secrets are configured."
