name: Check LINE Protection Bot

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check Python syntax
        run: python -m py_compile app.py

      - name: Check required files
        run: |
          test -f app.py
          test -f README.md
          echo "LINE Protection Bot check completed successfully."
