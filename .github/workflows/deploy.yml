name: Deploy LINE Protection Bot

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flask requests

      - name: Check files
        run: |
          echo "Current directory:"
          pwd
          echo "Files:"
          ls -la
          echo "Searching for app.py:"
          find . -maxdepth 3 -type f -name "app.py" -print

      - name: Check app.py
        run: |
          APP_FILE=$(find . -maxdepth 3 -type f -name "app.py" -print -quit)

          if [ -z "$APP_FILE" ]; then
            echo "ERROR: app.py was not found!"
            exit 1
          fi

          echo "Found: $APP_FILE"
          python -m py_compile "$APP_FILE"
          echo "app.py syntax OK!"

      - name: Check LINE secrets
        env:
          LINE_CHANNEL_SECRET: ${{ secrets.LINE_CHANNEL_SECRET }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
        run: |
          test -n "$LINE_CHANNEL_SECRET"
          test -n "$LINE_CHANNEL_ACCESS_TOKEN"
          echo "LINE secrets are configured."

      - name: Run LINE Bot
        env:
          LINE_CHANNEL_SECRET: ${{ secrets.LINE_CHANNEL_SECRET }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
        run: |
          APP_FILE=$(find . -maxdepth 3 -type f -name "app.py" -print -quit)
          echo "Starting: $APP_FILE"
          python "$APP_FILE"
